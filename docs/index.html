<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Cixing Customer Hub</title>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>

<!-- ===== LOGIN VIEW ===== -->
<div id="login-view">
  <div class="login-card">
    <img src="assets/logo.png" alt="Cixing" class="login-logo">
    <p class="login-sub">Customer Hub — Cixing Bangladesh Ltd. internal system</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@cixingbd.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="Your password" autocomplete="current-password">
    </div>
    <p id="login-error" class="login-error"></p>
    <button class="btn-primary" id="login-btn" onclick="handleLogin()">Log in</button>
    <p class="login-foot">Forgot password? Ask your admin to reset it.</p>
  </div>
</div>

<!-- ===== APP VIEW ===== -->
<div id="app-view">
  <div class="sidebar">
    <div class="sidebar-brand"><img src="assets/logo-white.png" alt="Cixing" class="sidebar-logo"><span>Customer Hub</span></div>

    <div class="nav-group">
      <div class="nav-item active" data-page="home"><i class="ti ti-home"></i>Home</div>
      <div class="nav-item" data-page="factories"><i class="ti ti-building-factory-2"></i>Factories</div>
      <div class="nav-item" data-page="visits"><i class="ti ti-clipboard-text"></i>Visits</div>
      <div class="nav-item" data-page="followups"><i class="ti ti-checklist"></i>Follow-ups<span class="nav-badge" id="followup-badge">0</span></div>
    </div>

    <div class="nav-divider"></div>

    <div class="nav-group">
      <div class="nav-item" data-page="quotations"><i class="ti ti-file-invoice"></i>Quotations</div>
      <div class="nav-item" data-page="pipeline"><i class="ti ti-chart-funnel"></i>Pipeline</div>
    </div>

    <div class="nav-divider"></div>

    <div class="nav-group">
      <div class="nav-item" data-page="machines"><i class="ti ti-tool"></i>Machines</div>
      <div class="nav-item" data-page="service"><i class="ti ti-settings"></i>Service</div>
    </div>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="user-initials">—</div>
        <div class="who">
          <div class="name" id="user-name">Loading...</div>
          <div class="role" id="user-role"></div>
        </div>
        <i class="ti ti-logout logout-icon" title="Log out" onclick="handleLogout()"></i>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-search autocomplete-wrap">
        <i class="ti ti-search"></i>
        <input id="global-search-input" placeholder="Search factories, contacts..." autocomplete="off" oninput="onGlobalSearchInput(this.value)">
        <div id="global-search-dropdown" class="autocomplete-dropdown"></div>
      </div>
    </div>

    <div class="content" id="content">
      <!-- rendered by JS -->
    </div>
  </div>

  <button class="fab" onclick="openVisitModal()"><i class="ti ti-plus"></i>Log visit</button>

  <!-- ===== MOBILE BOTTOM NAV ===== -->
  <nav class="mobile-bottomnav">
    <div class="mnav-item nav-item" data-page="home"><i class="ti ti-home"></i><span>Home</span></div>
    <div class="mnav-item nav-item" data-page="factories"><i class="ti ti-building-factory-2"></i><span>Factories</span></div>
    <div class="mnav-fab" onclick="openVisitModal()"><i class="ti ti-plus"></i></div>
    <div class="mnav-item nav-item" data-page="followups"><i class="ti ti-checklist"></i><span>Follow-ups</span></div>
    <div class="mnav-item" onclick="openMoreSheet()"><i class="ti ti-dots"></i><span>More</span></div>
  </nav>
  <div id="more-sheet-root"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js?v=3"></script>
<script src="js/data.js?v=3"></script>
<script src="js/factories.js?v=3"></script>
<script src="js/contacts.js?v=3"></script>
<script src="js/visits.js?v=3"></script>
<script src="js/followups.js?v=3"></script>
<script src="js/auth.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
